<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>

<head>
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <title>Blog</title>
  <meta name="Blog Post" http-equiv="Content-Type" content="Blog Post">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
  
<body>
<div class="page-shell page-shell-blog">
  <div class="page-shell-inner">

<div class="page-header page-header-blog">
  <div class="page-header-back">
      <a href="index.html" style="text-decoration:none;display:inline-block;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
  </div>
  <div class="page-header-action">
      <button id="theme-toggle" onclick="toggleTheme()" style="background:none;border:none;cursor:pointer;padding:0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
      </button>
  </div>
</div>

<div class="page-title-row">
  <pageheading id="blog-title">Loading...</pageheading>
</div>

<hr/>

<div id="blog-toc-container"></div>
<div id="blog-content"></div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  function escapeHtml(value) {
    return value
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderContentPanels(markdown) {
    var panelPattern = /^:::[ \t]*(?:([a-zA-Z0-9_-]+)(?:\s+[^\n]+)?)?\n([\s\S]*?)^:::[ \t]*$/gm;

    return markdown.replace(panelPattern, function(match, kind, body) {
      var normalizedKind = kind ? kind.toLowerCase() : '';
      var safeKind = escapeHtml(normalizedKind);
      var panelBody = marked.parse(renderContentPanels(body.trim()));
      var kindClass = safeKind ? ' content-panel-' + safeKind : '';

      return '\n\n<section class="content-panel content-panel-plain' + kindClass + '">' +
        '<div class="content-panel-body">' + panelBody + '</div>' +
        '</section>\n\n';
    });
  }

  function extractTitleAndBody(markdown) {
    var titleMatch = markdown.match(/^\s*#\s+(.+)$/m);
    if (!titleMatch) {
      return {
        title: null,
        bodyMarkdown: markdown
      };
    }

    var bodyMarkdown = markdown.replace(/^\s*#\s+.+(?:\r?\n)+/, '');
    return {
      title: titleMatch[1].trim(),
      bodyMarkdown: bodyMarkdown
    };
  }

  marked.setOptions({
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      return hljs.highlightAuto(code).value;
    }
  });

  function wrapTables() {
    document.querySelectorAll('#blog-content table').forEach((table) => {
      if (table.parentElement && table.parentElement.classList.contains('table-wrapper')) {
        return;
      }
      var wrapper = document.createElement('div');
      wrapper.className = 'table-wrapper';
      table.parentNode.insertBefore(wrapper, table);
      wrapper.appendChild(table);
    });
  }

  function slugifyHeading(text) {
    return text
      .toLowerCase()
      .trim()
      .replace(/[^\w\s-]/g, '')
      .replace(/\s+/g, '-');
  }

  function assignHeadingIds() {
    const seen = new Map();
    document.querySelectorAll('#blog-content h1, #blog-content h2, #blog-content h3, #blog-content h4, #blog-content h5, #blog-content h6').forEach((heading) => {
      if (heading.id) {
        return;
      }

      const baseId = slugifyHeading(heading.textContent || '');
      if (!baseId) {
        return;
      }

      const count = seen.get(baseId) || 0;
      seen.set(baseId, count + 1);
      heading.id = count === 0 ? baseId : baseId + '-' + count;
    });
  }

  function buildBlogToc() {
    const container = document.getElementById('blog-toc-container');
    if (!container) {
      return;
    }

    const headings = Array.from(document.querySelectorAll('#blog-content h1, #blog-content h2, #blog-content h3, #blog-content h4'))
      .filter((heading) => heading.id && heading.textContent.trim());

    if (headings.length < 2) {
      container.innerHTML = '';
      return;
    }

    const uniqueLevels = Array.from(new Set(
      headings.map((heading) => Number(heading.tagName.slice(1)))
    )).sort((a, b) => a - b);
    const levelToDepth = new Map(uniqueLevels.map((level, index) => [level, index]));

    const details = document.createElement('details');
    details.className = 'blog-toc';

    const summary = document.createElement('summary');
    summary.innerHTML = '<strong>Contents</strong> <em>(click to expand)</em>';
    details.appendChild(summary);

    const rootList = document.createElement('ul');
    rootList.className = 'blog-toc-list';
    details.appendChild(rootList);

    const listStack = [rootList];
    const itemStack = [];

    headings.forEach((heading) => {
      const level = Number(heading.tagName.slice(1));
      const depth = levelToDepth.get(level) || 0;

      while (listStack.length - 1 > depth) {
        listStack.pop();
        itemStack.pop();
      }

      while (listStack.length - 1 < depth) {
        const parentItem = itemStack[itemStack.length - 1];
        if (!parentItem) {
          break;
        }

        const nestedList = document.createElement('ul');
        parentItem.appendChild(nestedList);
        listStack.push(nestedList);
      }

      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = '#' + heading.id;
      link.textContent = heading.textContent.trim();
      item.appendChild(link);
      listStack[listStack.length - 1].appendChild(item);

      itemStack[depth] = item;
      itemStack.length = depth + 1;
    });

    container.innerHTML = '';
    container.appendChild(details);
  }

  const urlParams = new URLSearchParams(window.location.search);
  const slug = urlParams.get('slug');

  if (!slug) {
    document.getElementById('blog-title').textContent = 'Blog not found';
    document.getElementById('blog-content').innerHTML = '<p>No blog specified. Use ?slug=blog-name in the URL.</p>';
  } else {
    fetch('blog/' + slug + '.md')
      .then(response => {
        if (!response.ok) throw new Error('Blog not found');
        return response.text();
      })
      .then(markdown => {
        const titleAndBody = extractTitleAndBody(markdown);
        const html = marked.parse(renderContentPanels(titleAndBody.bodyMarkdown));
        document.getElementById('blog-content').innerHTML = html;
        
        if (titleAndBody.title) {
          document.getElementById('blog-title').textContent = titleAndBody.title;
          document.title = titleAndBody.title;
        }

        assignHeadingIds();
        buildBlogToc();
        wrapTables();
        
        document.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });
      })
      .catch(err => {
        document.getElementById('blog-title').textContent = 'Blog not found';
        document.getElementById('blog-content').innerHTML = '<p>Could not load blog: ' + slug + '</p>';
      });
  }

  function toggleTheme() {
    var body = document.body;
    var btn = document.getElementById('theme-toggle');
    if (body.classList.contains('dark-mode')) {
      body.classList.remove('dark-mode');
      btn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
      localStorage.setItem('theme', 'light');
    } else {
      body.classList.add('dark-mode');
      btn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>';
      localStorage.setItem('theme', 'dark');
    }
  }

  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    document.getElementById('theme-toggle').innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>';
  } else {
    document.getElementById('theme-toggle').innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  }
</script>
</body>

</html>
